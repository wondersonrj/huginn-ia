name: AutoDev immutable validation
run-name: ${{ github.event_name == 'workflow_dispatch' && format('autodev-{0}-{1}-{2}', inputs.pr, inputs.head, inputs.base) || format('AutoDev PR {0} / {1}', github.event.pull_request.number, github.event.pull_request.head.sha) }}
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        type: string
        required: true
      head:
        type: string
        required: true
      base:
        type: string
        required: true
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/autodev-quality.yml
    with:
      ci_ref: ${{ inputs.head || github.event.pull_request.head.sha }}
  windows:
    uses: ./.github/workflows/autodev-windows-ci.yml
    with:
      ci_ref: ${{ inputs.head || github.event.pull_request.head.sha }}

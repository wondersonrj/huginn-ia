name: Real GitHub release validation
on:
  push:
    tags: ['v0.0.*']
permissions:
  contents: read
jobs:
  isolated-test-release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      VALIDATION_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restrict to explicitly pushed low-version test tags
        shell: pwsh
        run: |
          if ($env:VALIDATION_TAG -notmatch '^v0\.0\.([2-9]|[1-9][0-9]+)$') { throw 'Only isolated v0.0.2+ test releases allowed' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pytest -q
      - name: Select runner-only key directory
        shell: pwsh
        run: '"KEY_DIRECTORY=$env:RUNNER_TEMP/huginn-ephemeral-release-key" >> $env:GITHUB_ENV'
      - name: Generate isolated ephemeral signing key (never production)
        run: python packaging/windows/validation_key.py create --directory "$env:KEY_DIRECTORY"
      - name: Build disabled baseline A and release B
        shell: pwsh
        run: |
          python packaging/windows/build.py --version 0.0.1 --channel teste --public-key-file "$env:KEY_DIRECTORY/ephemeral.pub" --output baseline
          if ($LASTEXITCODE -ne 0) { throw 'Baseline build failed' }
          python packaging/windows/build.py --version ($env:VALIDATION_TAG.Substring(1)) --channel teste --public-key-file "$env:KEY_DIRECTORY/ephemeral.pub" --output validation-release
          if ($LASTEXITCODE -ne 0) { throw 'Target build failed' }
      - name: Test Windows target package
        run: python packaging/windows/smoke.py validation-release/HUGINN-IA-Windows-x64.zip
      - name: Sign test release manifest
        run: python packaging/windows/validation_key.py sign --directory "$env:KEY_DIRECTORY" --version ($env:VALIDATION_TAG.Substring(1)) --zip validation-release/HUGINN-IA-Windows-x64.zip
      - name: Destroy ephemeral private key before publication
        run: python packaging/windows/validation_key.py destroy --directory "$env:KEY_DIRECTORY"
      - name: Publish actual test release, never latest or production
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:VALIDATION_TAG --verify-tag --prerelease --latest=false --title "HUGINN IA $env:VALIDATION_TAG — validação isolada, não clientes" --notes-file packaging/windows/VALIDATION-RELEASE-NOTES.md validation-release/HUGINN-IA-Windows-x64.zip validation-release/HUGINN-IA-Windows-x64.zip.sha256 validation-release/manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Test release publication failed' }
      - name: Real HTTPS discovery, Windows upgrade and recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/windows/real_release_smoke.py --baseline baseline/HUGINN-IA-Windows-x64.zip --expected ($env:VALIDATION_TAG.Substring(1)) --output validation-release/real-release-proof.json
      - name: Attach successful Windows evidence to test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload $env:VALIDATION_TAG validation-release/real-release-proof.json
          if ($LASTEXITCODE -ne 0) { throw 'Evidence upload failed' }
      - name: Destroy private key even if earlier steps failed
        if: always()
        run: python packaging/windows/validation_key.py destroy --directory "$env:KEY_DIRECTORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-release-validation
          path: |
            validation-release/HUGINN-IA-Windows-x64.zip
            validation-release/HUGINN-IA-Windows-x64.zip.sha256
            validation-release/manifest.json
            validation-release/real-release-proof.json
          if-no-files-found: warn

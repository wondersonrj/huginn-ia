name: Windows installer homologation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/autodev-quality.yml
    with:
      ci_ref: ${{ github.event.pull_request.head.sha || github.sha }}
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt playwright
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pytest -q
      - run: python -m playwright install chromium
      - name: Build current homologation installer (no signing/publication credentials)
        run: |
          python packaging/windows/build.py --output installer-package
          if ($LASTEXITCODE -ne 0) { throw 'Package build failed' }
          python packaging/windows/build_installer.py --package installer-package/HUGINN-IA-Windows-x64.zip --output installer-output
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Portable runtime and signed update rollback regression
        run: |
          python packaging/windows/smoke.py installer-package/HUGINN-IA-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Runtime smoke failed' }
          python packaging/windows/update_smoke.py installer-package/HUGINN-IA-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Update rollback failed' }
      - name: Build synthetic upgrade fixture (never distributed)
        run: |
          python packaging/windows/build.py --version 0.4.1 --output upgrade-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade fixture failed' }
          python packaging/windows/build_installer.py --package upgrade-fixture/HUGINN-IA-Windows-x64.zip --output upgrade-installer
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade fixture installer failed' }
      - name: Install and use as a Windows operator without commands or token typing
        run: python packaging/windows/installer_smoke.py --installer installer-output/HUGINN-IA-Setup.exe --upgrade upgrade-installer/HUGINN-IA-Setup.exe
      - uses: actions/checkout@v4
        with:
          ref: 5c46882abeceae966fb1ae1560b483f67ab3ce3b
          path: legacy-020
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 602341d2a6c920404e4c0dcae5f179f50f6c1362
          path: legacy-030
          persist-credentials: false
      - name: Build real historical 0.2.0 and 0.3.0 Setup fixtures (never distributed)
        run: |
          foreach ($source in @('legacy-020', 'legacy-030')) {
            Push-Location $source
            npm ci --prefix frontend
            if ($LASTEXITCODE -ne 0) { throw 'Historical dependencies failed' }
            npm run build --prefix frontend
            if ($LASTEXITCODE -ne 0) { throw 'Historical frontend failed' }
            python packaging/windows/build.py --output legacy-package
            if ($LASTEXITCODE -ne 0) { throw 'Historical package failed' }
            python packaging/windows/build_installer.py --package legacy-package/HUGINN-IA-Windows-x64.zip --output legacy-installer
            if ($LASTEXITCODE -ne 0) { throw 'Historical installer failed' }
            Pop-Location
          }
          python packaging/windows/make_failure_fixture.py upgrade-fixture/HUGINN-IA-Windows-x64.zip broken-package/failed.zip
          if ($LASTEXITCODE -ne 0) { throw 'Failure fixture failed' }
          python packaging/windows/build_installer.py --package broken-package/failed.zip --output broken-installer
          if ($LASTEXITCODE -ne 0) { throw 'Failure installer failed' }
      - name: Historical installed and portable upgrade, rollback and interrupted recovery
        run: python packaging/windows/installer_upgrade_smoke.py --installer installer-output/HUGINN-IA-Setup.exe --broken broken-installer/HUGINN-IA-Setup.exe --old-020 legacy-020/legacy-installer/HUGINN-IA-Setup.exe --old-030 legacy-030/legacy-installer/HUGINN-IA-Setup.exe --portable legacy-020/legacy-package/HUGINN-IA-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HUGINN-IA-Setup-homologation-${{ github.sha }}
          path: |
            installer-output/HUGINN-IA-Setup.exe
            installer-output/HUGINN-IA-Setup.exe.sha256
            installer-output/INSTALLER-INFO.json
          if-no-files-found: error

name: Smart Connector Windows Setup
on:
  push:
    branches: [main]
    paths: ['smart_connector/**', '.github/workflows/smart-connector-windows.yml']
  pull_request:
    paths: ['smart_connector/**', '.github/workflows/smart-connector-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smart-connector-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install pinned build and test dependencies
        run: python -m pip install --require-hashes -r smart_connector/windows/requirements.lock
      - name: Unit and security tests
        run: python -m pytest -q -o pythonpath=. smart_connector/tests
      - name: Install verified Inno Setup 6.4.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe -OutFile "$env:RUNNER_TEMP/inno.exe"
          $hash = (Get-FileHash "$env:RUNNER_TEMP/inno.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'f3c42116542c4cc57263c5ba6c4feabfc49fe771f2f98a79d2f7628b8762723b') { throw 'Inno checksum mismatch' }
          $p = Start-Process "$env:RUNNER_TEMP/inno.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Inno installation failed' }
      - name: Build bundled runtime and Setup.exe
        shell: pwsh
        run: ./smart_connector/windows/build.ps1
      - name: Windows installation, service, API, update and uninstall tests
        run: python smart_connector/windows/smoke.py
      - name: Upload tested installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: HUGINN-Smart-Connector-0.2.1-Windows-${{ github.run_id }}
          path: |
            work/connector-output/HUGINN_Smart_Connector_Setup.exe
            work/connector-output/HUGINN_Smart_Connector_Setup.exe.sha256
            work/connector-output/build-info.json
            work/connector-output/windows-test-results.json
          if-no-files-found: error
          retention-days: 30

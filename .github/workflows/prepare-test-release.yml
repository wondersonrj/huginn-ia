name: Prepare test release
on:
  workflow_dispatch:
    inputs:
      confirm_test_release:
        description: 'Explicitly approve a test release with client updates DISABLED'
        type: boolean
        default: false
      version:
        description: 'New semantic version X.Y.Z; greater than installed bootstrap version'
        type: string
        required: true
        default: '0.3.0'
permissions:
  contents: read
concurrency:
  group: huginn-test-release-preparation
  cancel-in-progress: false
jobs:
  prepare-test-release:
    if: github.repository == 'wondersonrj/huginn-ia' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare test tag from passed main; never enable clients or production
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CONFIRM_TEST_RELEASE: ${{ inputs.confirm_test_release }}
        run: python scripts/distribution/prepare_test_release.py --version "$VERSION"

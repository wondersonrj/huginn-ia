name: AutoDev Windows CI only
on:
  workflow_call:
    inputs:
      ci_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ci_ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pytest -q --junitxml=release/backend-tests.xml
      - name: Backend test evidence
        if: always()
        run: python packaging/windows/ci_summary.py
      - name: Build disabled test portable ZIP
        run: python packaging/windows/build.py
      - run: python packaging/windows/smoke.py release/HUGINN-IA-Windows-x64.zip
      - run: python packaging/windows/update_smoke.py release/HUGINN-IA-Windows-x64.zip
      - name: Browser tests on Windows
        shell: pwsh
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python packaging/windows/browser_smoke.py release/HUGINN-IA-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HUGINN-IA-Windows-x64
          path: |
            release/HUGINN-IA-Windows-x64.zip
            release/HUGINN-IA-Windows-x64.zip.sha256
            release/backend-tests.xml
          if-no-files-found: error

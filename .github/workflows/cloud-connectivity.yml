name: Cloud HTTPS diagnostics and contracts
on:
  pull_request:
    paths: ['smart_connector/**', 'docs/PCINF9803_CLOUD.md', '.github/workflows/cloud-connectivity.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-diagnostics-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install --require-hashes -r smart_connector/windows/requirements.lock
      - name: Contracts, authorization, TLS, WinHTTP errors and reconnect
        run: python -m pytest -q -o pythonpath=. smart_connector/tests
      - name: Package operator diagnosis and Delphi integration sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/cloud-diagnostics | Out-Null
          Compress-Archive -Path smart_connector/diagnostics/DIAGNOSTICAR_CLOUD.cmd,smart_connector/diagnostics/Test-HuginnCloud.ps1,smart_connector/diagnostics/Huginn.CloudDiagnostics.psm1,smart_connector/diagnostics/LEIA-ME.txt -DestinationPath work/cloud-diagnostics/HUGINN_Cloud_Diagnostics.zip
          Copy-Item docs/PCINF9803_CLOUD.md work/cloud-diagnostics/PCINF9803_CLOUD.md
          Get-FileHash work/cloud-diagnostics/HUGINN_Cloud_Diagnostics.zip -Algorithm SHA256 | Format-List | Out-File work/cloud-diagnostics/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HUGINN-Cloud-Diagnostics-${{ github.run_id }}
          path: |
            work/cloud-diagnostics/*
            smart_connector/delphi/
            smart_connector/contracts/
          if-no-files-found: error

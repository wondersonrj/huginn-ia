name: Windows portable build
on:
  push:
    branches: [main]
    paths-ignore:
      - "release/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python packaging/windows/build.py
      - run: python packaging/windows/smoke.py release/HUGINN-IA-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HUGINN-IA-Windows-x64
          path: |
            release/HUGINN-IA-Windows-x64.zip
            release/HUGINN-IA-Windows-x64.zip.sha256
          if-no-files-found: error
